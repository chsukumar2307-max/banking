spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT and security properties for tests
app.jwt.secret=ZmFrZXNlY3JldGtleWZvcnRlc3RzZmFrZXNlY3JldGtleWZvcnRlc3Q=
app.jwt.issuer=test-issuer
app.jwt.expiration-minutes=60

# Twilio dummy values for tests
app.sms.simulate=true
twilio.accountSid=ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
twilio.authToken=your_auth_token
twilio.phoneNumber=+1234567890

# Other required test properties
app.account.default-page-size=10
app.refresh-token.expiry-seconds=604800
app.account.max-account-generation-attempts=10
app.otp.length=6
