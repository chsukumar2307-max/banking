plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.6'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'org.sonarqube' version '4.0.0.2929'
    id 'jacoco'
}

group = 'com.bank'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}

repositories {
    mavenCentral()
}

dependencies {
    // CVE REMEDIATION: Ensure safe version of commons-compress for test dependencies
    testImplementation 'org.apache.commons:commons-compress:1.26.1'

    // ===============================
    // 🌱 SPRING BOOT STARTERS
    // ===============================
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ===============================
    // 🗄️ DATABASE
    // ===============================
    runtimeOnly 'com.mysql:mysql-connector-j:8.3.0'

    // ===============================
    // 📄 API DOCUMENTATION
    // ===============================
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // ===============================
    // 🔐 SECURITY & AUTH
    // ===============================
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ===============================
    // 📩 EXTERNAL SERVICES
    // ===============================
    implementation('com.twilio.sdk:twilio:9.14.0') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    // ===============================
    // 🔒 CVE REMEDIATION: Explicitly override vulnerable transitive dependencies
    // ===============================
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'commons-io:commons-io:2.14.0'

    // ===============================
    // 🧰 LOMBOK
    // ===============================
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // ===============================
    // 🧪 TESTING
    // ===============================
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core:5.2.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'

    // In-memory DB for tests
    testImplementation 'com.h2database:h2:2.2.224'

    // Optional (Integration Testing)
    testImplementation('org.testcontainers:junit-jupiter:1.19.7') {
        exclude group: 'org.apache.commons', module: 'commons-compress'
    }
    testImplementation('org.testcontainers:mysql:1.19.7') {
        exclude group: 'org.apache.commons', module: 'commons-compress'
    }
    testImplementation 'org.apache.commons:commons-compress:1.26.1'

    // ===============================
    // 🌱 ENVIRONMENT VARIABLE LOADER
    // ===============================
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "banking-backend"

        property "sonar.host.url", "http://localhost:9000"
        property  "sonar.token", "squ_c8fd638a2fb03409d6b07fd624ccda483029ada0"

        property "sonar.sources", "src/main/java"
        property "sonar.tests", "src/test/java"

        property "sonar.java.binaries", "build/classes/java/main"
        property "sonar.java.test.binaries", "build/classes/java/test"

        property "sonar.coverage.jacoco.xmlReportPaths",
                "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}

tasks.named('bootRun') {
    def envFile = file(".env")
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            if (line && !line.startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                environment key.trim(), value.trim()
            }
        }
    }
}

// Enable Java preview features if needed
// (Uncomment if you use preview features)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '--enable-preview'
}
tasks.withType(Test).configureEach {
    jvmArgs += '--enable-preview'
}
